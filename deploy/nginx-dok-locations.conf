# LLM-Wiki su subpath /dok/ di https://migration.mikweb.eu/
# Incluso dal custom template Plesk (solo dominio migration.mikweb.eu, solo blocco SSL).
# Fonte: repo llm-wiki deploy/nginx-dok-locations.conf — modifiche = nginx -t && reload.
#
# Auth: login grafico a token (POST /api/auth/login, utente DOK_USER in backend/.env).
# Niente auth_basic qui: il popup browser non è stilizzabile.
# Schema URL (frontend compilato con REACT_APP_API_URL=/dok/api):
#   /dok/api/api/documents/scan  -> backend /api/documents/scan   (tutte le API /api/*)
#   /dok/api/api/chat/stream     -> backend /api/chat/stream      (SSE streaming)
#   /dok/api/health              -> backend /health                (health-check leggero)
#   /dok/api/health/full         -> backend /health/full          (diagnostica, protetta da app)
#   /dok/api/metrics             -> backend /metrics               (protetta da app)
# ^~ vince sulla regex "location ~ ^/.*" del Docker-proxy Clumoove.

location ^~ /dok/api/api/ {
    proxy_pass http://127.0.0.1:8010/api/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    client_max_body_size 60m;
}

location ^~ /dok/api/ {
    proxy_pass http://127.0.0.1:8010/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    client_max_body_size 60m;
}

location = /dok {
    return 301 /dok/;
}

location ^~ /dok/ {
    # root (non alias): evita redirect-cycle di try_files + alias
    root /var/www/vhosts/mikweb.eu/migration.mikweb.eu;
    index index.html;
    # fallback SPA: sottorotte React -> index.html
    try_files $uri $uri/ /dok/index.html;
}
