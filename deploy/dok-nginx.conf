# LLM-Wiki su subpath /dok/ di https://migration.mikweb.eu/
# Dove: Plesk -> Websites & Domains -> migration.mikweb.eu
#        -> "Apache & nginx Settings" -> "Additional nginx directives" -> incolla -> OK
# Effetto: Plesk rigenera nginx.conf includendo questo blocco.
# ^~ vince sulla regex "location ~ ^/.*" del Docker-proxy Clumoove.
location ^~ /dok/api/ {
    # trailing slash: spoglia il prefisso /dok/api/ -> backend invariato
    # /dok/api/health -> /health ; /dok/api/api/documents/scan -> /api/documents/scan
    proxy_pass http://127.0.0.1:8010/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    client_max_body_size 60m;
}

location ^~ /dok/ {
    alias /var/www/vhosts/mikweb.eu/migration.mikweb.eu/dok/;
    index index.html;
    # fallback SPA: sottorotte React -> index.html
    try_files $uri $uri/ /dok/index.html;
}
